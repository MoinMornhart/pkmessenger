# Claude-GitHub-App: antwortet als „Claude“ auf @claude in Issues und Pull Requests.
# Vorlage: https://code.claude.com/docs/en/github-actions.md (anthropics/claude-code-action@v1)
# Braucht das Secret CLAUDE_CODE_OAUTH_TOKEN (Repo- oder Organisations-Secret, aus `claude setup-token`).
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude') || contains(github.event.pull_request.body, '@claude') || contains(github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
